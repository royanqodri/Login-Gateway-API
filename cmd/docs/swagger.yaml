        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_royanqodri_Login-Gateway-API_model_response.MainResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_royanqodri_Login-Gateway-API_model_response.MainResponse'
      security:
      - BearerAuth: []
      summary: Create Master User
      tags:
      - Master User
schemes:
- http
securityDefinitions:
